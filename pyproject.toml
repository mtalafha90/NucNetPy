[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nucnetpy"
version = "1.0.0"
description = "Pure-Python nuclear reaction networks: a replacement for NucNet Tools workflows"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.9"
authors = [
    {name = "Mohammed H. Talafha", email = "mtalafha901@gmail.com"},
    {name = "Nidal M. Ershaidat", email = "N.Ershaidat@ju.edu.jo"},
]
maintainers = [{name = "Mohammed H. Talafha", email = "mtalafha901@gmail.com"}]
license = {text = "GPL-3.0-or-later"}
keywords = [
    "nucleosynthesis", "nuclear-astrophysics", "reaction-network",
    "nucnet-tools", "libnucnet", "NSE", "r-process", "s-process",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["numpy>=1.22", "scipy>=1.9"]

[project.urls]
Homepage = "https://github.com/mtalafha90/NucNetPy"
Repository = "https://github.com/mtalafha90/NucNetPy"
Documentation = "https://github.com/mtalafha90/NucNetPy/blob/main/docs/manual/nucnetpy-manual.pdf"
Issues = "https://github.com/mtalafha90/NucNetPy/issues"
DOI = "https://doi.org/10.5281/zenodo.20756798"

[project.optional-dependencies]
hdf5 = ["h5py>=3.8"]
plot = ["matplotlib>=3.6", "networkx>=2.8"]
dev = ["pytest>=7"]
# Everything the tutorial notebooks import.  pandas is used only to display
# tables; the package itself never imports it.
notebook = ["jupyter>=1.0", "matplotlib>=3.6", "pandas>=1.5"]
# Building the user manual in docs/manual.  rinohtype renders the PDF without
# needing a LaTeX installation.
docs = ["sphinx>=7", "furo", "myst-parser", "rinohtype"]

[project.scripts]
nucnetpy = "nucnetpy.cli:main"

[tool.setuptools]
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
